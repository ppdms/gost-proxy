# GOST v3 Client Configuration
# Connects to Cloudflare Access protected WSS server with service token headers

services:
  - name: local-socks5-proxy
    addr: :1080
    handler:
      type: socks5
      chain: cloudflare-chain
      metadata:
        udp: true
    listener:
      type: tcp

  - name: nextcloud-forward
    addr: :7777
    handler:
      type: tcp
      chain: cloudflare-chain
    listener:
      type: tcp
    forwarder:
      nodes:
        - name: nextcloud-server
          addr: nextcloud.lan:7777

chains:
  - name: cloudflare-chain
    hops:
      - name: hop-0
        nodes:
          - name: cloudflare-pht
            addr: ${GOST_SERVER_ADDRESS}
            connector:
              type: http
            dialer:
              type: wss
              tls:
                serverName: ${GOST_SERVER_HOSTNAME}
              metadata:
                header:
                  CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID}"
                  CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET}"

log:
  level: info
  output: stderr
