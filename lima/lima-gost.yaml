# ===================================================================== #
# Lima VM configuration for GOST v3 Client
# Runs GOST v3 client to connect to Cloudflare Access protected proxy
# Uses PHT (Plain HTTP Tunnel) protocol with custom header support
# ===================================================================== #

# VM type: "vz" for macOS 13+
vmType: "vz"

# Architecture
arch: null

# OpenStack-compatible disk image
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20251031/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:499fa6088985c641e38d69cfd98105a3e45dc082f07ad5779db49ccb958bc3a9"
  # Fallback to the latest release image
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Resource allocation
cpus: 2
memory: "2GiB"
disk: "5GiB"

# SSH configuration
ssh:
  localPort: 0
  loadDotSSHPubKeys: true
  forwardAgent: false

# Networks: user-mode for internet (via Zscaler), vzNAT for host-VM communication
networks:
  - lima: user-v2
  - vzNAT: true
    interface: "vznat0"

# Port forwarding: SOCKS5 proxy on 1080
portForwards:
  - guestSocket: "/tmp/gost.sock"
    hostSocket: "/tmp/gost.sock"
  - guestPort: 1080
    hostPort: 1080
    proto: tcp

# CA Certificates - Lima copies these before provisioning
caCerts:
  removeDefaults: null
  files:
    - /tmp/zscaler-root.crt
  certs: []

# Don't upgrade packages on boot - this should prevent cloud-init from doing apt operations
upgradePackages: false

# No containerd needed for this VM
containerd:
  system: false
  user: false

# Provisioning scripts (idempotent)
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # Disable systemd-timesyncd to avoid NTP timeout delays
      systemctl disable --now systemd-timesyncd || true

      # Configure vznat0 with high route metric via netplan so eth0 (user-v2) is preferred
      # This persists across DHCP renewals unlike manual ip route commands
      printf '%s\n' 'network:' '  version: 2' '  ethernets:' '    vznat0:' '      dhcp4: true' '      dhcp4-overrides:' '        route-metric: 300' > /etc/netplan/90-vznat-metric.yaml
      chmod 600 /etc/netplan/90-vznat-metric.yaml

      # Apply netplan config
      netplan apply || true

      # Remove any existing vznat0 default route with low metric
      ip route del default dev vznat0 2>/dev/null || true

      echo "✓ Configured vznat0 with high route metric (300) via netplan"
      echo "✓ Minimal provisioning complete"

# Probes scripts to check readiness
probes:
  - mode: readiness
    description: systemd
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until systemctl is-system-running --wait; do sleep 3; done"; then
        echo >&2 "systemd is not running"
        exit 1
      fi
    hint: |
      The systemd service is not yet running.
      Run "limactl shell gost sudo systemctl status" to check the status.
