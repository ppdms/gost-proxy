# ===================================================================== #
# Lima VM configuration for GOST v3 Client
# Runs GOST v3 client to connect to Cloudflare Access protected proxy
# Uses PHT (Plain HTTP Tunnel) protocol with custom header support
# ===================================================================== #

# VM type: "vz" for macOS 13+
vmType: "vz"

# Architecture
arch: null

# OpenStack-compatible disk image
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20251031/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:499fa6088985c641e38d69cfd98105a3e45dc082f07ad5779db49ccb958bc3a9"
  # Fallback to the latest release image
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Resource allocation
cpus: 2
memory: "1GiB"
disk: "10GiB"

# Mount host directories
mounts:
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

# SSH configuration
ssh:
  localPort: 0
  loadDotSSHPubKeys: true
  forwardAgent: false

# Port forwarding: SOCKS5 proxy on 1080
portForwards:
  - guestSocket: "/tmp/gost.sock"
    hostSocket: "/tmp/gost.sock"
  - guestPort: 1080
    hostPort: 1080
    proto: tcp

# CA Certificates - Lima copies these before provisioning
caCerts:
  removeDefaults: null
  files:
    - /tmp/zscaler-root.crt
  certs: []

# Don't upgrade packages on boot - provision scripts will handle it
upgradePackages: false

# No containerd needed for this VM
containerd:
  system: false

# Provisioning scripts (idempotent)
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Wait a moment for CA certificates to be fully processed
      sleep 2
      
      # Update CA certificates (Lima should have already copied zscaler-root.crt)
      update-ca-certificates
      
      # List installed CAs to verify
      ls -la /usr/local/share/ca-certificates/ || true
      
      echo "✓ CA certificates updated"

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Replace HTTP URLs with HTTPS in sources (required for Zscaler)
      # Zscaler blocks plain HTTP but allows HTTPS
      sed -i 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
      
      # Update package lists
      apt-get update
      
      # Install build dependencies and security packages
      apt-get install -y git wget build-essential curl ca-certificates \
                         iptables unattended-upgrades apt-listchanges
      
      echo "✓ Build dependencies installed"

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Configure Git to use system CA bundle (including Zscaler cert)
      git config --system http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
      
      echo "✓ Git configured to use system CA certificates"

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Configure unattended-upgrades for automatic security updates
      cat > /etc/apt/apt.conf.d/50unattended-upgrades <<'EOF'
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
      EOF
      
      # Enable automatic security updates
      cat > /etc/apt/apt.conf.d/20auto-upgrades <<'EOF'
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      EOF
      
      echo "✓ Automatic security updates configured"

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      
      # Create upgrade script to run after GOST is configured
      cat > /usr/local/bin/upgrade-after-gost.sh <<'EOF'
      #!/bin/bash
      set -e
      
      # Wait for GOST service to be running and stable
      echo "Waiting for GOST service to be ready..."
      for i in {1..30}; do
        if systemctl is-active gost.service >/dev/null 2>&1; then
          echo "GOST service is running"
          sleep 5  # Give it a moment to stabilize
          break
        fi
        sleep 2
      done
      
      # Now upgrade packages
      echo "Upgrading packages..."
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
      
      echo "Package upgrade complete"
      EOF
      
      chmod +x /usr/local/bin/upgrade-after-gost.sh
      
      # Create systemd service to run upgrade after GOST is up
      cat > /etc/systemd/system/upgrade-after-gost.service <<'EOF'
      [Unit]
      Description=Upgrade packages after GOST is configured
      After=gost.service
      Wants=gost.service
      
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/upgrade-after-gost.sh
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target
      EOF
      
      systemctl daemon-reload
      
      echo "✓ Post-GOST upgrade service configured"

# Probe scripts to check readiness
probes:
  - mode: readiness
    description: systemd
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! timeout 30s bash -c "until systemctl is-system-running --wait; do sleep 3; done"; then
        echo >&2 "systemd is not running"
        exit 1
      fi
    hint: |
      The systemd service is not yet running.
      Run "limactl shell gost sudo systemctl status" to check the status.
