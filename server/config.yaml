# GOST v3 Server Configuration
# WSS (Secure WebSocket) protocol for Cloudflare Access compatibility
# This server runs on your-server.example.com

services:
  - name: wss-server
    addr: :8080
    handler:
      type: http
      metadata:
        udp: true
    listener:
      type: ws

log:
  level: info
  output: stderr
